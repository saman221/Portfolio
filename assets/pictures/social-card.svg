<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Saman Majidi — Web Designer and Developer</title>
  <desc id="desc">Dark portfolio preview with a cobalt architecture motif and SM monogram.</desc>
  <defs>
